name: CPU tests and package

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      JAX_PLATFORMS: cpu
      MPLBACKEND: Agg
      OMP_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install CPU package and independent reference
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'torch==2.6.0' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[cpu,dev,reference]'
          python -m pip check
      - name: Check documentation and source syntax
        run: |
          python scripts/check_docs.py
          python -m compileall -q src scripts tests
          bash -n scripts/setup.sh scripts/run_side.sh
      - name: Test and run offline smoke workflow
        run: |
          python -m pytest -q
          layer-parity smoke --out runs/ci-smoke
      - name: Build wheel and source distribution
        run: python -m build
      - name: Verify wheel outside the source tree
        run: |
          python -m venv /tmp/parity-wheel --system-site-packages
          /tmp/parity-wheel/bin/python -m pip install --no-deps dist/*.whl
          cd /tmp
          /tmp/parity-wheel/bin/layer-parity --version
          /tmp/parity-wheel/bin/layer-parity doctor --backend cpu
