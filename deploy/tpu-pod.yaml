# 기존 단일 호스트 Ironwood 노드풀용. 멀티 호스트 slice에는 적용하지 않습니다.
# YOUR_TPU_NODE_POOL을 실제 이름으로 변경합니다. JAX device 수와 칩 수는 다릅니다.
apiVersion: v1
kind: Pod
metadata:
  name: parity-tpu
spec:
  restartPolicy: Never
  nodeSelector:
    cloud.google.com/gke-nodepool: YOUR_TPU_NODE_POOL
  tolerations:
    - key: google.com/tpu
      operator: Exists
      effect: NoSchedule
  containers:
    - name: lab
      image: python:3.12-slim-bookworm
      command: ["bash", "-lc", "sleep infinity"]
      workingDir: /work
      resources:
        requests:
          cpu: "4"
          memory: 16Gi
          ephemeral-storage: 40Gi
          google.com/tpu: "4"
        limits:
          memory: 32Gi
          ephemeral-storage: 80Gi
          google.com/tpu: "4"
      volumeMounts:
        - name: work
          mountPath: /work
  volumes:
    - name: work
      emptyDir:
        sizeLimit: 70Gi
